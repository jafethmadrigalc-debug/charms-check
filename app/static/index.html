<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Charms</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #388bfd;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; padding: 20px 24px 60px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .stats-bar { display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-bottom:16px; }
  .stats-bar b { color: var(--text); }

  select, input[type=text], input[type=url], input[type=number], button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; font-size: 13px;
  }
  button { cursor: pointer; transition: background .15s, border-color .15s; }
  button:hover { background: var(--panel-2); }
  button.primary { background: var(--accent-2); color:#fff; font-weight:600; border:none; }
  button.primary:hover { background: var(--accent); }
  button.primary:disabled { opacity:.4; cursor:default; }
  button.pill { border-radius: 20px; padding: 6px 14px; }
  button.pill.active { background: var(--accent-2); border-color: var(--accent-2); color:#fff; font-weight:600; }

  .panel { background: var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel-title { font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .settings-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:12px; align-items:end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:var(--muted); }

  .switch { position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#3a3f47; transition:.2s; border-radius:22px; }
  .slider:before { position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background:#fff; transition:.2s; border-radius:50%; }
  input:checked + .slider { background: var(--accent-2); }
  input:checked + .slider:before { transform: translateX(18px); }
  .switch-row { display:flex; align-items:center; gap:10px; }

  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }

  /* Pestañas principales: Todos / Mis guardados */
  .main-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .main-tab {
    background:transparent; border:none; border-bottom:2px solid transparent;
    border-radius:0; padding:10px 18px; font-size:14px; color:var(--muted);
    font-weight:500;
  }
  .main-tab:hover { background:var(--panel); color:var(--text); }
  .main-tab.active { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .main-tab .count {
    display:inline-block; margin-left:7px; padding:1px 7px; border-radius:20px;
    background:var(--panel-2); font-size:11px; color:var(--muted); font-weight:600;
  }
  .main-tab.active .count { background:var(--accent-2); color:#fff; }

  .tracked-empty {
    text-align:center; padding:50px 20px; color:var(--muted);
    background:var(--panel); border:1px dashed var(--border); border-radius:12px;
  }
  .tracked-empty .big { font-size:34px; margin-bottom:12px; }
  .filters { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:10px; margin-bottom:12px; }
  .hidden { display:none !important; }

  /* Tarjetas */
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:14px; }
  .card {
    background: var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .card.tracked { border-color: var(--yellow); }
  .card-body { padding:12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-title { font-weight:600; font-size:13.5px; line-height:1.35; }
  .card-desc { color:var(--muted); font-size:12px; line-height:1.45; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chip { font-size:10.5px; padding:2px 7px; border-radius:20px; background:#21262d; border:1px solid var(--border); color:var(--muted); }
  .chip.austin { color:#f0883e; border-color:#f0883e44; }
  .chip.budapest { color:#58a6ff; border-color:#58a6ff44; }
  .chip.cologne { color:#d29922; border-color:#d2992244; }
  .card-footer { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:8px; border-top:1px solid var(--border); }
  .price-tag { font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; }
  .price-tag.none { color:var(--muted); font-weight:400; font-size:13px; }
  .price-label { font-size:10px; color:var(--muted); display:block; font-weight:400; }
  .spacer { flex:1; }
  .icon-btn { background:transparent; border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:14px; line-height:1; }
  .icon-btn.on { border-color: var(--yellow); }
  a.steam-btn { text-decoration:none; }
  .empty-state { text-align:center; color:var(--muted); padding:40px; grid-column:1/-1; }
  #loadMoreWrap { text-align:center; margin-top:18px; }

  /* Grupos de 10 para abrir en tandas */
  .groups {
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-bottom:16px;
  }
  .groups-head { font-weight:600; margin-bottom:4px; }
  .groups-sub { color:var(--muted); font-size:12px; margin-bottom:12px; line-height:1.5; }
  .group-list { display:flex; gap:8px; flex-wrap:wrap; }
  .group-btn {
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:9px 14px; border:1px solid var(--border); border-radius:9px;
    background:var(--panel-2); min-width:132px;
  }
  .group-btn:hover { border-color:var(--accent); }
  .group-btn .g-title { font-weight:600; font-size:13px; }
  .group-btn .g-sub { font-size:10.5px; color:var(--muted); }
  .group-btn.done { border-color:var(--green); opacity:.65; }
  .group-btn.done .g-title::after { content:" ✓"; color:var(--green); }
  .group-btn:disabled { opacity:.5; cursor:wait; }

</style>
</head>
<body>

<h1>CS2 Charms</h1>
<div class="stats-bar" id="stats">Cargando...</div>

<!-- Configuración (colapsable) -->
<div class="panel">
  <div class="panel-title" style="justify-content:space-between;">
    <span>⚙️ Configuración de alertas</span>
    <button id="toggleSettings">Mostrar</button>
  </div>
  <div id="settingsBody" class="hidden">
    <div class="settings-grid">
      <div class="field">
        <label>Webhook de Discord</label>
        <input type="url" id="discordWebhook" placeholder="https://discord.com/api/webhooks/...">
      </div>
      <div class="field">
        <label>Costo de "Quitar colgante"</label>
        <input type="number" id="removeCost" value="150" step="1">
      </div>
      <div class="field">
        <label>Revisar cada (minutos)</label>
        <input type="number" id="alertInterval" value="15" step="1" min="5">
      </div>
      <div class="field">
        <div class="switch-row">
          <label class="switch"><input type="checkbox" id="alertsEnabled"><span class="slider"></span></label>
          <span>Alertas activas</span>
        </div>
      </div>
      <div class="field">
        <button class="primary" id="saveSettingsBtn">Guardar</button>
      </div>
    </div>
    <div class="muted" style="font-size:12px; margin-top:10px; color:var(--muted);">
      Marca la ⭐ de un colgante para vigilarlo — el sistema revisa en segundo plano y te avisa por Discord cuando encuentra una oportunidad nueva.
    </div>
  </div>
</div>

<!-- Pestañas principales -->
<div class="main-tabs">
  <button class="main-tab active" data-view="all">Todos los colgantes <span class="count" id="countAll">0</span></button>
  <button class="main-tab" data-view="tracked">⭐ Mis guardados <span class="count" id="countTracked">0</span></button>
</div>

<!-- Filtros por evento -->
<div class="toolbar">
  <button class="pill active" data-event="">Todos</button>
  <button class="pill" data-event="Cologne 2026">Cologne 2026</button>
  <button class="pill" data-event="Budapest 2025">Budapest 2025</button>
  <button class="pill" data-event="Austin 2025">Austin 2025</button>
  <span style="color:var(--muted)">|</span>
  <input type="text" id="search" placeholder="Buscar jugador, equipo, descripción..." style="min-width:240px;">
  <button id="toggleFilters">Filtros avanzados</button>
</div>

<div class="filters hidden" id="advFilters">
  <select id="filterTeam"><option value="">Todos los equipos</option></select>
  <select id="filterPlayer"><option value="">Todos los jugadores</option></select>
  <select id="filterStage"><option value="">Todas las etapas</option></select>
  <select id="filterMap"><option value="">Todos los mapas</option></select>
</div>

<div class="toolbar">
  <select id="sortBy">
    <option value="price_desc">Precio: mayor a menor</option>
    <option value="price_asc">Precio: menor a mayor</option>
    <option value="name">Nombre (A-Z)</option>
    <option value="updated">Actualizado recientemente</option>
  </select>
  <div class="switch-row">
    <label class="switch"><input type="checkbox" id="onlyPriced"><span class="slider"></span></label>
    <span style="font-size:13px;">Solo con precio</span>
  </div>
  <span class="spacer"></span>
  <a href="/api/export" download="charms_backup.json" style="text-decoration:none;"><button>⬇ Respaldo</button></a>
  <button id="refreshBtn">↻ Refrescar</button>
</div>

<div id="openAllNote" style="font-size:12px; color:var(--yellow); margin-bottom:10px;"></div>
<div id="groupsPanel" class="hidden"></div>

<div class="grid" id="grid"></div>
<div id="loadMoreWrap"><button id="loadMoreBtn" class="hidden">Cargar más</button></div>

<script>
let allCharms = [];
let filtered = [];
let shownCount = 0;
const PAGE_SIZE = 60;
let currentEvent = "";
let currentView = "all";   // "all" o "tracked"

// ---------- Carga de datos ----------
async function loadStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    document.getElementById("stats").innerHTML = `
      <span><b>${s.priced}</b> / ${s.total} con precio</span>
      <span><b>${s.watched}</b> guardados</span>
      <span>última actualización: <b>${s.newest_update ? new Date(s.newest_update).toLocaleString() : "aún ninguna"}</b></span>`;
  } catch (e) { /* silencioso */ }
}

async function loadSettings() {
  try {
    const s = await (await fetch("/api/settings")).json();
    document.getElementById("discordWebhook").value = s.discord_webhook_url || "";
    document.getElementById("removeCost").value = s.remove_keychain_cost;
    document.getElementById("alertInterval").value = s.alert_interval_minutes;
    document.getElementById("alertsEnabled").checked = s.alerts_enabled;
  } catch (e) { /* silencioso */ }
}

async function loadCharms() {
  allCharms = await (await fetch("/api/charms")).json();
  buildFilterOptions();
  applyFilters();
}

// ---------- Filtros ----------
function buildFilterOptions() {
  const teams = new Set(), players = new Set(), stages = new Set(), maps = new Set();
  allCharms.forEach(c => {
    if (c.team0) teams.add(c.team0);
    if (c.team1) teams.add(c.team1);
    if (c.player) players.add(c.player);
    if (c.stage) stages.add(c.stage);
    if (c.map) maps.add(c.map);
  });
  fillSelect("filterTeam", teams, "Todos los equipos");
  fillSelect("filterPlayer", players, "Todos los jugadores");
  fillSelect("filterStage", stages, "Todas las etapas");
  fillSelect("filterMap", maps, "Todos los mapas");
}

function fillSelect(id, values, placeholder) {
  const el = document.getElementById(id);
  const prev = el.value;
  el.innerHTML = `<option value="">${placeholder}</option>` +
    [...values].sort((a,b)=>a.localeCompare(b)).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  el.value = prev;
}

function applyFilters() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const team = document.getElementById("filterTeam").value;
  const player = document.getElementById("filterPlayer").value;
  const stage = document.getElementById("filterStage").value;
  const map = document.getElementById("filterMap").value;
  const onlyPriced = document.getElementById("onlyPriced").checked;
  const sortBy = document.getElementById("sortBy").value;

  filtered = allCharms.filter(c => {
    if (currentEvent && c.event !== currentEvent) return false;
    if (team && c.team0 !== team && c.team1 !== team) return false;
    if (player && c.player !== player) return false;
    if (stage && c.stage !== stage) return false;
    if (map && c.map !== map) return false;
    if (currentView === "tracked" && !c.watched) return false;
    if (onlyPriced && (c.base_price === null || c.base_price === undefined)) return false;
    if (q) {
      const hay = `${c.market_hash_name||""} ${c.description||""} ${c.player||""} ${c.team0||""} ${c.team1||""} ${c.map||""} ${c.stage||""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => {
    const ap = a.base_price, bp = b.base_price;
    if (sortBy === "price_desc") return (bp ?? -1) - (ap ?? -1);
    if (sortBy === "price_asc") {
      if (ap === null || ap === undefined) return 1;
      if (bp === null || bp === undefined) return -1;
      return ap - bp;
    }
    if (sortBy === "name") return a.market_hash_name.localeCompare(b.market_hash_name);
    if (sortBy === "updated") return (b.last_updated||"").localeCompare(a.last_updated||"");
    return 0;
  });

  updateTabCounts();

  shownCount = 0;
  document.getElementById("grid").innerHTML = "";
  renderMore();
  renderGroups();
}

function updateTabCounts() {
  document.getElementById("countAll").textContent = allCharms.length;
  document.getElementById("countTracked").textContent = allCharms.filter(c => c.watched).length;
}

// ---------- Render ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function eventChipClass(ev) {
  if (ev === "Austin 2025") return "austin";
  if (ev === "Budapest 2025") return "budapest";
  if (ev === "Cologne 2026") return "cologne";
  return "";
}

function steamSearchUrl(c) {
  // Buscar la DESCRIPCIÓN exacta entre comillas con descriptions=1 es lo
  // que encuentra las armas que tienen ESE colgante puesto (el nombre solo
  // encontraría el colgante suelto).
  const term = c.description ? `"${c.description}"` : `"${c.market_hash_name}"`;
  const params = new URLSearchParams({
    appid: "730",
    q: term,
    descriptions: "1",
  });
  params.append("category_730_ItemSet[]", "any");
  params.append("category_730_Weapon[]", "any");
  params.append("category_730_Quality[]", "any");
  return `https://steamcommunity.com/market/search?${params.toString()}#p1_price_asc`;
}

function cardHtml(c) {
  const priced = c.base_price !== null && c.base_price !== undefined;
  return `
  <div class="card ${c.watched ? 'tracked':''}" data-name="${esc(c.market_hash_name)}">
    <div class="card-body">
      <div class="card-title">${esc(c.market_hash_name.split("|").pop().trim())}</div>
      <div class="chips">
        <span class="chip ${eventChipClass(c.event)}">${esc(c.event)}</span>
        ${c.map ? `<span class="chip">${esc(c.map)}</span>`:""}
        ${c.stage ? `<span class="chip">${esc(c.stage)}</span>`:""}
        ${c.player ? `<span class="chip">${esc(c.player)}</span>`:""}
      </div>
      <div class="card-desc">${esc(c.description || "")}</div>
      <div class="card-footer">
        <div>
          <span class="price-label">precio colgante</span>
          <span class="price-tag ${priced?'':'none'}">${priced ? '$'+c.base_price.toFixed(2) : '—'}</span>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn track-btn ${c.watched?'on':''}" title="Guardar / vigilar">${c.watched?'⭐':'☆'}</button>
        <a class="steam-btn" href="${steamSearchUrl(c)}" target="_blank" rel="noopener">
          <button class="primary">Ver en Steam ↗</button>
        </a>
      </div>
    </div>
  </div>`;
}

function renderMore() {
  const grid = document.getElementById("grid");
  if (filtered.length === 0) {
    const hayGuardados = allCharms.some(c => c.watched);
    if (currentView === "tracked" && !hayGuardados) {
      grid.innerHTML = `
        <div class="tracked-empty" style="grid-column:1/-1;">
          <div class="big">☆</div>
          <div style="font-size:15px; color:var(--text); margin-bottom:6px;">Todavía no has guardado ningún colgante</div>
          <div>Ve a "Todos los colgantes" y toca la ☆ de los que te interesen.<br>
          Aquí los tendrás juntos para revisarlos rápido.</div>
        </div>`;
    } else {
      grid.innerHTML = `<div class="empty-state">Sin resultados con estos filtros.</div>`;
    }
    document.getElementById("loadMoreBtn").classList.add("hidden");
    return;
  }
  const slice = filtered.slice(shownCount, shownCount + PAGE_SIZE);
  grid.insertAdjacentHTML("beforeend", slice.map(cardHtml).join(""));
  shownCount += slice.length;

  const btn = document.getElementById("loadMoreBtn");
  if (shownCount < filtered.length) {
    btn.classList.remove("hidden");
    btn.textContent = `Cargar más (${filtered.length - shownCount} restantes)`;
  } else {
    btn.classList.add("hidden");
  }
  wireCards();
}

function wireCards() {
  document.querySelectorAll(".card").forEach(card => {
    if (card.dataset.wired) return;
    card.dataset.wired = "1";

    // Guardar / vigilar
    const btn = card.querySelector(".track-btn");
    btn.addEventListener("click", async () => {
      const name = card.dataset.name;
      const charm = allCharms.find(x => x.market_hash_name === name);
      const next = !charm.watched;
      btn.textContent = "…";
      try {
        await fetch("/api/watch", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ market_hash_names: [name], watched: next })
        });
        charm.watched = next;
        btn.textContent = next ? "⭐" : "☆";
        btn.classList.toggle("on", next);
        card.classList.toggle("tracked", next);
        updateTabCounts();
        loadStats();

        // Si estamos en "Mis guardados" y se desmarcó, la tarjeta ya no
        // pertenece a esta vista: la sacamos con una animación breve.
        if (currentView === "tracked" && !next) {
          card.style.transition = "opacity .25s, transform .25s";
          card.style.opacity = "0";
          card.style.transform = "scale(.96)";
          setTimeout(() => applyFilters(), 250);
        }
      } catch (e) {
        btn.textContent = charm.watched ? "⭐" : "☆";
      }
    });
  });
}

// ---------- Eventos de UI ----------
document.querySelectorAll(".main-tab[data-view]").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".main-tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentView = b.dataset.view;
    applyFilters();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

document.querySelectorAll(".pill[data-event]").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".pill[data-event]").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentEvent = b.dataset.event;
    applyFilters();
  });
});

["search","filterTeam","filterPlayer","filterStage","filterMap","sortBy","onlyPriced"]
  .forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(el.tagName === "INPUT" && el.type === "text" ? "input" : "change", applyFilters);
  });

document.getElementById("toggleFilters").addEventListener("click", () => {
  document.getElementById("advFilters").classList.toggle("hidden");
});
document.getElementById("toggleSettings").addEventListener("click", (e) => {
  const body = document.getElementById("settingsBody");
  body.classList.toggle("hidden");
  e.target.textContent = body.classList.contains("hidden") ? "Mostrar" : "Ocultar";
});
document.getElementById("loadMoreBtn").addEventListener("click", renderMore);
document.getElementById("refreshBtn").addEventListener("click", () => { loadStats(); loadCharms(); });

document.getElementById("saveSettingsBtn").addEventListener("click", async () => {
  const btn = document.getElementById("saveSettingsBtn");
  btn.textContent = "Guardando...";
  try {
    await fetch("/api/settings", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        discord_webhook_url: document.getElementById("discordWebhook").value.trim(),
        remove_keychain_cost: parseFloat(document.getElementById("removeCost").value) || 150,
        alert_interval_minutes: parseFloat(document.getElementById("alertInterval").value) || 15,
        alerts_enabled: document.getElementById("alertsEnabled").checked,
      })
    });
    btn.textContent = "✓ Guardado";
  } catch (e) {
    btn.textContent = "Error";
  }
  setTimeout(()=>{ btn.textContent = "Guardar"; }, 1500);
});

// ---------- Grupos de 10 para abrir en tandas ----------
const GROUP_SIZE = 10;
const openedGroups = new Set();

function renderGroups() {
  const panel = document.getElementById("groupsPanel");

  // Solo tiene sentido en la pestaña de guardados
  if (currentView !== "tracked") {
    panel.classList.add("hidden");
    return;
  }

  const guardados = filtered;  // respeta los filtros activos
  if (guardados.length === 0) {
    panel.classList.add("hidden");
    return;
  }

  const totalGrupos = Math.ceil(guardados.length / GROUP_SIZE);
  const botones = [];

  for (let g = 0; g < totalGrupos; g++) {
    const desde = g * GROUP_SIZE;
    const hasta = Math.min(desde + GROUP_SIZE, guardados.length);
    const cuantos = hasta - desde;
    const yaAbierto = openedGroups.has(g);
    botones.push(`
      <button class="group-btn ${yaAbierto ? 'done' : ''}" data-group="${g}">
        <span class="g-title">Grupo ${g + 1}</span>
        <span class="g-sub">${desde + 1}–${hasta} · ${cuantos} link${cuantos !== 1 ? 's' : ''}</span>
      </button>`);
  }

  panel.innerHTML = `
    <div class="groups">
      <div class="groups-head">↗ Abrir en Steam por tandas</div>
      <div class="groups-sub">
        Tus ${guardados.length} guardado(s) están divididos en ${totalGrupos} grupo(s) de hasta ${GROUP_SIZE}.
        Abre un grupo a la vez para no saturar el navegador ni hacer demasiadas consultas seguidas a Steam.
      </div>
      <div class="group-list">${botones.join("")}</div>
      <div id="groupNote" style="font-size:12px; color:var(--yellow); margin-top:10px;"></div>
    </div>`;
  panel.classList.remove("hidden");

  panel.querySelectorAll(".group-btn").forEach(btn => {
    btn.addEventListener("click", () => abrirGrupo(parseInt(btn.dataset.group, 10), btn));
  });
}

function abrirGrupo(g, btn) {
  const nota = document.getElementById("groupNote");
  const desde = g * GROUP_SIZE;
  const tanda = filtered.slice(desde, desde + GROUP_SIZE);
  if (tanda.length === 0) return;

  btn.disabled = true;
  const textoOriginal = btn.querySelector(".g-sub").textContent;
  nota.textContent = `Abriendo grupo ${g + 1} (${tanda.length} pestañas)...`;

  let abiertas = 0, bloqueadas = 0;

  tanda.forEach((c, i) => {
    // Retraso entre cada pestaña: abrirlas de golpe hace que el navegador
    // las bloquee como pop-ups y que Steam reciba una ráfaga de consultas.
    setTimeout(() => {
      const w = window.open(steamSearchUrl(c), "_blank");
      if (w) abiertas++; else bloqueadas++;
      btn.querySelector(".g-sub").textContent = `abriendo ${i + 1}/${tanda.length}...`;

      if (i === tanda.length - 1) {
        setTimeout(() => {
          btn.disabled = false;
          btn.querySelector(".g-sub").textContent = textoOriginal;
          openedGroups.add(g);
          btn.classList.add("done");
          nota.textContent = bloqueadas > 0
            ? `Grupo ${g + 1}: se abrieron ${abiertas} de ${tanda.length}. El navegador bloqueó ${bloqueadas} — permite las ventanas emergentes de este sitio.`
            : `✓ Grupo ${g + 1}: ${abiertas} pestaña(s) abierta(s).`;
        }, 400);
      }
    }, i * 400);
  });
}

loadStats();
loadSettings();
loadCharms();
setInterval(loadStats, 30000);
</script>
